# Example client configuration for kbforge.
# Copy this file, adjust the values, then run:
#   kbforge build --config config.yaml

client_name: demo

sources:
  # Seed URLs to start the crawl from.
  urls:
    - "https://example.com"
  # Only these domains (and their subdomains) may be crawled.
  # Leave empty to derive the domain list from the seed URLs.
  allowed_domains:
    - "example.com"
  # Directory of uploaded client files (PDF, DOCX, HTML, TXT). Optional.
  files_dir: "./client_files"

crawl:
  max_depth: 2
  max_pages: 300
  delay_seconds: 1.0
  timeout_seconds: 15
  retries: 3
  user_agent: "kbforge/0.1 (academic IR project; polite crawler)"

chunking:
  strategy: fixed        # one of: fixed | sentence | paragraph
  size: 300              # target chunk size in tokens (fixed) or words (others)
  overlap: 50            # overlap between consecutive fixed-size chunks

index:
  bm25: true
  dense: true
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

output_dir: "./output/demo"
