[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbforge"
version = "0.1.0"
description = "Turn client data (URLs, domains, files) into a ready-to-use knowledge base for search and RAG"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "PyYAML>=6.0",
    "trafilatura>=1.6.0",
    "datasketch>=1.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kbforge = "kbforge.cli:main"

[tool.setuptools.packages.find]
include = ["kbforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
